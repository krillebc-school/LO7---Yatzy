<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>YATZY</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css" />
    <script src="yatzyHjerne.js" defer></script>
    
</head>
<body>
    
<div class="wrapper">
    

    <!-- Terninger -->
    <div class="frameBox" id="terningBox">
        <div class="terningBox" id="terning1"></div>
        <div class="terningBox" id="terning2"></div>
        <div class="terningBox" id="terning3"></div>
        <div class="terningBox" id="terning4"></div>
        <div class="terningBox" id="terning5"></div>
        <button id="rollBtn">Roll Dice</button>
    </div>

   
    <!-- Scoretavle -->
    <div class="frameBox" id="pointBox">

        <div class="scoreRow"><span>1-s</span><input id="ones"></div>
        <div class="scoreRow"><span>2-s</span><input id="twos"></div>
        <div class="scoreRow"><span>3-s</span><input id="threes"></div>
        <div class="scoreRow"><span>4-s</span><input id="fours"></div>
        <div class="scoreRow"><span>5-s</span><input id="fives"></div>
        <div class="scoreRow"><span>6-s</span><input id="sixes"></div>

        <div class="scoreRow"><span>One pair</span><input id="onePair"></div>
        <div class="scoreRow"><span>Two pair</span><input id="twoPair"></div>
        <div class="scoreRow"><span>Three same</span><input id="threeSame"></div>
        <div class="scoreRow"><span>Four same</span><input id="fourSame"></div>
        <div class="scoreRow"><span>Full house</span><input id="fullHouse"></div>
        <div class="scoreRow"><span>Small straight</span><input id="smallStraight"></div>
        <div class="scoreRow"><span>Big straight</span><input id="bigStraight"></div>
        <div class="scoreRow"><span>Chance</span><input id="chance"></div>
        <div class="scoreRow"><span>Yatzy</span><input id="yatzy"></div>

        <hr>

        <div class="scoreRow"><strong>Sum tal</strong><input id="sumNumbers"></div>
        <div class="scoreRow"><strong>Bonus</strong><input id="bonus"></div>
        <div class="scoreRow"><strong>Sum</strong><input id="sum"></div>
        <div class="scoreRow"><strong>Total</strong><input id="total"></div>

    </div>
</div>

<!-- Billeder -->
<div style="display:none;">
    <img src="https://www.media4math.com/sites/default/files/library_asset/images/MathClipArt--Single-Die-with-1-Showing.png" id="dice1" width="120" height="120">
    <img src="https://www.media4math.com/sites/default/files/library_asset/images/MathClipArt--Single-Die-with-2-Showing.png" id="dice2" width="120" height="120">
    <img src="https://www.media4math.com/sites/default/files/library_asset/images/MathClipArt--Single-Die-with-3-Showing.png" id="dice3" width="120" height="120">
    <img src="https://www.media4math.com/sites/default/files/library_asset/images/MathClipArt--Single-Die-with-4-Showing.png" id="dice4" width="120" height="120">
    <img src="https://www.media4math.com/sites/default/files/library_asset/images/MathClipArt--Single-Die-with-5-Showing.png" id="dice5" width="120" height="120">
    <img src="https://www.media4math.com/sites/default/files/library_asset/images/MathClipArt--Single-Die-with-6-Showing.png" id="dice6" width="120" height="120">
</div>

</body>
</body>
</html>
